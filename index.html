<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cedb objective images</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0da; --accent: #2f5d50; --accent-ink: #ffffff; --warn: #9a3b26;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151618; --card: #1e2023; --ink: #ececec; --muted: #9a9ca1;
            --line: #2e3135; --accent: #7fb8a4; --accent-ink: #10201a; --warn: #e48b74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 28px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 11px 13px; font: inherit; color: inherit;
         background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; padding: 11px 16px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .msg { margin-top: 14px; min-height: 1.5em; color: var(--muted); }
  .msg.error { color: var(--warn); }
  .card { margin-top: 24px; background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 20px; }
  .who { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .who img { width: 44px; height: 44px; border-radius: 50%; background: var(--line); }
  .who .name { font-weight: 600; }
  .who .file { color: var(--muted); font-size: 0.9rem; }
  .rows { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
         padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .label { font-weight: 500; }
  .row .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row button { min-width: 128px; }
  .all { margin-top: 16px; display: flex; justify-content: flex-end; }
  .progress { margin-top: 12px; font-size: 0.92rem; color: var(--muted); }
  .progress.error { color: var(--warn); }
  footer { margin-top: 40px; font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>cedb objective images</h1>
  <p class="lede">Paste a cedb.me user page link to download that user's completed objective images, zipped by objective type.</p>

  <form id="lookup">
    <input id="link" type="text" autocomplete="off" spellcheck="false"
           placeholder="https://cedb.me/user/…" aria-label="cedb user page link">
    <button id="go" type="submit">Look up</button>
  </form>
  <div id="msg" class="msg" role="status"></div>

  <section id="result" class="card" hidden>
    <div class="who">
      <img id="avatar" alt="">
      <div>
        <div id="dname" class="name"></div>
        <div id="fname" class="file"></div>
      </div>
    </div>
    <div id="rows" class="rows"></div>
    <div class="all"><button id="all" class="secondary">Download all</button></div>
    <div id="progress" class="progress" role="status"></div>
  </section>

  <footer>Independent tool, not affiliated with cedb.me. Images remain the property of their owners.</footer>
</main>

<script>
(() => {
  'use strict';

  // Objective "type" values from the cedb API, in display order.
  const GROUPS = [
    { type: 'primary',          suffix: 'POs',      label: 'Primary objectives' },
    { type: 'secondary',        suffix: 'SOs',      label: 'Secondary objectives' },
    { type: 'community',        suffix: 'COs',      label: 'Community objectives' },
    { type: 'site-achievement', suffix: 'SiteAchs', label: 'Site achievements' },
  ];
  const CONCURRENCY = 6;
  const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

  const $ = (id) => document.getElementById(id);
  let state = null; // { fileUser, groups: { type: [objective...] } }
  let busy = false;

  // ---------- naming ----------

  // Display name: letters and numbers only ("They/Themaleena :3c" -> "TheyThemaleena3c").
  function cleanUserName(name) {
    const s = String(name || '').replace(/[^\p{L}\p{N}]/gu, '');
    return s || 'cedbUser';
  }

  // Remove characters Windows/macOS/Linux reject in file names.
  function cleanFilePart(s) {
    return String(s || '')
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .replace(/[\\/:*?"<>|]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Game names like "- Challenge Enthusiasts -" lose their decorative dashes.
  function cleanGameName(s) {
    return cleanFilePart(s).replace(/^[\s\-–—]+|[\s\-–—]+$/g, '');
  }

  function extensionFor(url, contentType) {
    const m = /\.(jpe?g|png|gif|webp|avif|bmp)$/i.exec(new URL(url).pathname);
    if (m) return m[1].toLowerCase() === 'jpeg' ? 'jpg' : m[1].toLowerCase();
    const t = (contentType || '').split(';')[0].trim();
    return ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif',
              'image/webp': 'webp', 'image/avif': 'avif', 'image/bmp': 'bmp' })[t] || 'img';
  }

  function baseName(obj) {
    const game = cleanGameName(obj.game && obj.game.name);
    const name = cleanFilePart(obj.name) || obj.id;
    let s = game ? `${game} - ${name}` : name;
    s = s.slice(0, 150).replace(/[ .]+$/, '');
    return s || obj.id;
  }

  // ---------- minimal zip writer (stored, no compression; images are already compressed) ----------

  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  function dosDateTime(d) {
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    return { time, date };
  }

  function buildZip(files) {
    const enc = new TextEncoder();
    const { time, date } = dosDateTime(new Date());
    const parts = [];
    const central = [];
    let offset = 0;

    for (const f of files) {
      const name = enc.encode(f.name);
      const data = f.data;
      const crc = crc32(data);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);        // version needed
      lh.setUint16(6, 0x0800, true);    // UTF-8 file names
      lh.setUint16(8, 0, true);         // stored
      lh.setUint16(10, time, true);
      lh.setUint16(12, date, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, time, true);
      ch.setUint16(14, date, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);

      offset += 30 + name.length + data.length;
    }

    const cdSize = central.reduce((n, p) => n + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
  }

  // ---------- downloading ----------

  async function fetchImage(url) {
    const r = await fetch('/api/image?url=' + encodeURIComponent(url));
    if (!r.ok) {
      let reason = `HTTP ${r.status}`;
      try { reason = (await r.json()).error || reason; } catch {}
      throw new Error(reason);
    }
    return { data: new Uint8Array(await r.arrayBuffer()), type: r.headers.get('content-type') };
  }

  async function makeZip(group) {
    const objs = state.groups[group.type];
    const files = new Array(objs.length);
    const failed = [];
    let done = 0;
    let next = 0;

    const report = () => setProgress(`${group.label}: ${done} of ${objs.length} images…`);
    report();

    async function worker() {
      while (next < objs.length) {
        const i = next++;
        const o = objs[i];
        try {
          if (!o.icon) throw new Error('no image on this objective');
          const img = await fetchImage(o.icon);
          files[i] = { base: baseName(o), ext: extensionFor(o.icon, img.type), data: img.data };
        } catch (e) {
          failed.push(`${baseName(o)}  (${o.icon || 'no URL'}): ${e.message}`);
        }
        done++;
        report();
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, objs.length) }, worker));

    // Unique names inside the zip.
    const used = new Set();
    const out = [];
    for (const f of files) {
      if (!f) continue;
      let name = `${f.base}.${f.ext}`;
      for (let n = 2; used.has(name.toLowerCase()); n++) name = `${f.base} (${n}).${f.ext}`;
      used.add(name.toLowerCase());
      out.push({ name, data: f.data });
    }
    if (failed.length) {
      out.push({ name: '_missing_images.txt',
                 data: new TextEncoder().encode(failed.join('\r\n') + '\r\n') });
    }

    const zipName = `${state.fileUser}_${group.suffix}.zip`;
    saveBlob(buildZip(out), zipName);
    return { zipName, saved: out.length - (failed.length ? 1 : 0), failed: failed.length };
  }

  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }

  function summary(r) {
    return `${r.zipName}: ${r.saved} image${r.saved === 1 ? '' : 's'}` +
           (r.failed ? `, ${r.failed} could not be downloaded (listed in _missing_images.txt)` : '');
  }

  async function run(groupsToRun) {
    if (busy) return;
    busy = true;
    setButtons(false);
    const results = [];
    try {
      for (const g of groupsToRun) {
        results.push(await makeZip(g));
        await new Promise((r) => setTimeout(r, 400)); // let the browser start each download
      }
      setProgress('Done. ' + results.map(summary).join('. ') + '.',
                  results.some((r) => r.failed));
    } catch (e) {
      setProgress('Something went wrong: ' + e.message, true);
    } finally {
      busy = false;
      setButtons(true);
    }
  }

  // ---------- UI ----------

  function setMsg(text, isError) {
    $('msg').textContent = text;
    $('msg').className = 'msg' + (isError ? ' error' : '');
  }
  function setProgress(text, isError) {
    $('progress').textContent = text;
    $('progress').className = 'progress' + (isError ? ' error' : '');
  }
  function setButtons(enabled) {
    document.querySelectorAll('#result button').forEach((b) => {
      b.disabled = !enabled || b.dataset.empty === '1';
    });
  }

  function render(user) {
    const groups = Object.fromEntries(GROUPS.map((g) => [g.type, []]));
    for (const uo of user.userObjectives || []) {
      const o = uo && uo.objective;
      if (o && groups[o.type]) groups[o.type].push(o);
    }
    for (const t in groups) {
      groups[t].sort((a, b) => baseName(a).localeCompare(baseName(b)));
    }
    state = { fileUser: cleanUserName(user.displayName), groups };

    $('dname').textContent = user.displayName || '(no display name)';
    $('fname').textContent = `Zip files: ${state.fileUser}_POs.zip, _SOs.zip, _COs.zip, _SiteAchs.zip`;
    if (user.avatar) { $('avatar').src = user.avatar; $('avatar').hidden = false; }
    else { $('avatar').hidden = true; }

    const rows = $('rows');
    rows.replaceChildren();
    for (const g of GROUPS) {
      const n = groups[g.type].length;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="label"></span><span class="count"></span>';
      row.querySelector('.label').textContent = g.label;
      row.querySelector('.count').textContent = n === 1 ? '1 image' : `${n} images`;
      const b = document.createElement('button');
      b.textContent = `${g.suffix}.zip`;
      b.dataset.empty = n ? '0' : '1';
      b.dataset.type = g.type;
      b.title = n ? `Download ${state.fileUser}_${g.suffix}.zip` : 'None of this type';
      b.addEventListener('click', () => run([g]));
      row.appendChild(b);
      rows.appendChild(row);
    }
    const allBtn = $('all');
    const nonEmpty = GROUPS.filter((g) => groups[g.type].length);
    allBtn.dataset.empty = nonEmpty.length ? '0' : '1';
    allBtn.onclick = () => run(nonEmpty);
    setButtons(true);
    setProgress(nonEmpty.length ? '' : 'This user has no completed objectives yet.');
    $('result').hidden = false;
  }

  $('lookup').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (busy) return;
    const m = UUID_RE.exec($('link').value);
    if (!m) {
      setMsg('That does not look like a cedb user link. Expected something like https://cedb.me/user/<id>.', true);
      return;
    }
    $('go').disabled = true;
    $('result').hidden = true;
    setMsg('Looking up user…');
    try {
      const r = await fetch('/api/user?id=' + m[0].toLowerCase());
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
      setMsg('');
      render(body);
    } catch (e) {
      setMsg('Lookup failed: ' + e.message, true);
    } finally {
      $('go').disabled = false;
    }
  });
})();
</script>
</body>
</html>
